name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test

  dogfood:
    name: weigh real servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Direct mode against the fixtures
        run: |
          node dist/cli.js -- node fixtures/heavy-server.js
          node dist/cli.js -- node fixtures/light-server.js

      # Real servers move without warning; this warns us the ecosystem moved
      # without gating our own correctness.
      - name: Weigh the reference servers
        continue-on-error: true
        run: |
          mkdir -p /tmp/sandbox
          cat > /tmp/cfg.json <<'EOF'
          {
            "mcpServers": {
              "filesystem": { "command": "npx", "args": ["-y", "@modelcontextprotocol/server-filesystem", "/tmp/sandbox"] },
              "everything": { "command": "npx", "args": ["-y", "@modelcontextprotocol/server-everything"] }
            }
          }
          EOF
          node dist/cli.js --config /tmp/cfg.json --timeout 60000
